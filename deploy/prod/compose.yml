services:
  redis:
    image: redis:7.4.11-bookworm
    container_name: battletwo-signaling-prod-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    networks:
      - signaling-prod
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  signaling-a:
    image: battletwo-signaling:910e42c
    container_name: battletwo-signaling-prod-a
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: battletwo:prod:signaling
      RTC_HOST: 0.0.0.0
      RTC_PORT: "5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - signaling-prod
    restart: unless-stopped
    stop_grace_period: 15s

  signaling-b:
    image: battletwo-signaling:910e42c
    container_name: battletwo-signaling-prod-b
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_KEY_PREFIX: battletwo:prod:signaling
      RTC_HOST: 0.0.0.0
      RTC_PORT: "5000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - signaling-prod
    restart: unless-stopped
    stop_grace_period: 15s

  turn-credentials-a:
    image: battletwo-turn-credentials:260829-1
    container_name: battletwo-turn-credentials-prod-a
    command:
      - node
      - src/server/turnCredentialServer.js
    environment:
      TURN_CREDENTIAL_HOST: 0.0.0.0
      TURN_CREDENTIAL_PORT: "5001"
      TURN_CREDENTIAL_TTL_SECONDS: "900"
      TURN_URLS: ${TURN_URLS:?TURN_URLS is required}
      TURN_SHARED_SECRET_FILE: /run/secrets/turn_shared_secret
      TURN_CREDENTIAL_ALLOWED_ORIGIN: "*"
    secrets:
      - turn_shared_secret
    networks:
      - signaling-prod
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('http');
          const req=http.get(
            'http://127.0.0.1:5001/healthz',
            (res)=>{
              res.resume();
              process.exit(res.statusCode===200?0:1);
            }
          );
          req.on('error',()=>process.exit(1));
          req.setTimeout(
            2000,
            ()=>{
              req.destroy();
              process.exit(1);
            }
          );
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  turn-credentials-b:
    image: battletwo-turn-credentials:260829-1
    container_name: battletwo-turn-credentials-prod-b
    command:
      - node
      - src/server/turnCredentialServer.js
    environment:
      TURN_CREDENTIAL_HOST: 0.0.0.0
      TURN_CREDENTIAL_PORT: "5001"
      TURN_CREDENTIAL_TTL_SECONDS: "900"
      TURN_URLS: ${TURN_URLS:?TURN_URLS is required}
      TURN_SHARED_SECRET_FILE: /run/secrets/turn_shared_secret
      TURN_CREDENTIAL_ALLOWED_ORIGIN: "*"
    secrets:
      - turn_shared_secret
    networks:
      - signaling-prod
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const http=require('http');
          const req=http.get(
            'http://127.0.0.1:5001/healthz',
            (res)=>{
              res.resume();
              process.exit(res.statusCode===200?0:1);
            }
          );
          req.on('error',()=>process.exit(1));
          req.setTimeout(
            2000,
            ()=>{
              req.destroy();
              process.exit(1);
            }
          );
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  lb:
    image: nginx:alpine
    container_name: battletwo-signaling-prod-lb
    ports:
      - "8083:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      signaling-a:
        condition: service_healthy
      signaling-b:
        condition: service_healthy
      turn-credentials-a:
        condition: service_healthy
      turn-credentials-b:
        condition: service_healthy
    networks:
      - signaling-prod
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  signaling-prod:
    name: battletwo-signaling-prod-net
    driver: bridge

volumes:
  redis-data:
    name: battletwo-signaling-prod-redis-data

secrets:
  turn_shared_secret:
    file: /etc/battletwo/turn_shared_secret
