worker_processes auto;

events {
    worker_connections 1024;
}

http {
    limit_req_zone $binary_remote_addr zone=turn_credentials_limit:10m rate=30r/m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream battletwo_signaling {
        least_conn;

        server signaling-a:5000 max_fails=1 fail_timeout=5s;
        server signaling-b:5000 max_fails=1 fail_timeout=5s;
    }

    upstream battletwo_turn_credentials {
        least_conn;

        server turn-credentials-a:5001 max_fails=1 fail_timeout=5s;
        server turn-credentials-b:5001 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name _;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /turn-credentials {
            limit_req zone=turn_credentials_limit burst=10 nodelay;

            proxy_pass http://battletwo_turn_credentials;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;

            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_buffering off;
        }

        location / {
            proxy_pass http://battletwo_signaling;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;

            proxy_buffering off;
        }
    }
}
